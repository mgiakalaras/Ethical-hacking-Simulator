
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["flask"]
    command:
      - run
      - --host=0.0.0.0
      - --port=5000
    ports:
      - "15000:5000"
    environment:
      FLASK_ENV: production
    networks:
      - simulator_network
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - simulator_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "18080:80"
    networks:
      - simulator_network
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  simulator_network:
    driver: bridge

volumes:
  redis_data:
