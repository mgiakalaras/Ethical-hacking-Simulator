
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "12222:2222"
      - "15000:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - simulator_network
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - simulator_network

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "18080:80"
    volumes:
      - ./frontend/web:/usr/share/nginx/html:ro
    networks:
      - simulator_network

networks:
  simulator_network:
    driver: bridge

volumes:
  redis_data:
