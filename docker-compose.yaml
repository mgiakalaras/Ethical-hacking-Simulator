
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: app_backend
    restart: unless-stopped
    networks:
      isolated_network:
        ipv4_address: 172.22.0.2
    ports:
      - "2222:2222"
      - "5000:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 3g
    cpus: 2.0

  redis:
    image: redis:alpine
    container_name: redis
    restart: unless-stopped
    networks:
      isolated_network:
        ipv4_address: 172.22.0.3
    volumes:
      - redis_data:/data
    mem_limit: 256m

  frontend:
    image: nginx:alpine
    container_name: frontend_service
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./frontend/web:/usr/share/nginx/html
    networks:
      isolated_network:
        ipv4_address: 172.22.0.4
    user: root
    command: sh -c "chmod -R 755 /usr/share/nginx/html && nginx -g 'daemon off;'"
    mem_limit: 256m
    cpus: 0.5

networks:
  isolated_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.203.0.0/24
          gateway: 10.203.0.1

volumes:
  redis_data:
